<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- hk_shop.svg · 玩偶店 · 傍晚暖光 · 手写矢量，1600×900
       可视带：对话框盖住 y ≈ 622 以下，货架墙与吊灯全部压在线上。 -->
  <defs>
    <linearGradient id="spWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E3C8"/><stop offset="0.55" stop-color="#EDD3B2"/>
      <stop offset="1" stop-color="#D9B78F"/>
    </linearGradient>
    <linearGradient id="spFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AD7C4E"/><stop offset="0.5" stop-color="#8E5F38"/>
      <stop offset="1" stop-color="#633E22"/>
    </linearGradient>
    <linearGradient id="spShelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C79A6C"/><stop offset="1" stop-color="#A87A50"/>
    </linearGradient>
    <linearGradient id="spDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E6BA8"/><stop offset="0.6" stop-color="#9C7FA6"/>
      <stop offset="1" stop-color="#E7A98A"/>
    </linearGradient>
    <radialGradient id="spLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFEFC4" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFE3A8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spWarmth" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFEBC2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFEBC2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spVig" cx="0.5" cy="0.44" r="0.8">
      <stop offset="0.42" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2A1A0C" stop-opacity="0.52"/>
    </radialGradient>

    <!-- 玩偶部件：不写 fill，颜色由外层 <use fill="…"> 继承 -->
    <g id="spBear">
      <ellipse cx="0" cy="12" rx="24" ry="21"/>
      <circle cx="-17" cy="-12" r="9"/><circle cx="17" cy="-12" r="9"/>
      <circle cx="0" cy="-10" r="19"/>
    </g>
    <g id="spBunny">
      <ellipse cx="0" cy="12" rx="21" ry="20"/>
      <ellipse cx="-10" cy="-30" rx="6" ry="16" transform="rotate(-10 -10 -30)"/>
      <ellipse cx="10" cy="-30" rx="6" ry="16" transform="rotate(10 10 -30)"/>
      <circle cx="0" cy="-8" r="17"/>
    </g>
    <g id="spBlob">
      <ellipse cx="0" cy="10" rx="26" ry="22"/>
      <ellipse cx="-13" cy="-14" rx="8" ry="7"/><ellipse cx="13" cy="-14" rx="8" ry="7"/>
      <circle cx="0" cy="-12" r="17"/>
    </g>
    <g id="spLizard">
      <!-- 大尾巴鲨鱼蜥蜴：圆头 + 短爪 + 一条很大的尾巴（背鳍一列） -->
      <path d="M0 6 q-22 0 -26 -18 q-4 -20 14 -26 q16 -6 26 4 q12 -10 26 -2 q16 8 12 26 q-4 16 -26 16 z"/>
      <path d="M24 6 q30 6 46 30 q-22 8 -46 -2 z"/>
      <path d="M26 12 l10 -8 l-2 12 l10 -6 l-2 12 l10 -4" fill="none" stroke="#8A6A50" stroke-width="3"/>
      <path d="M-26 4 q-8 10 -4 20 M22 6 q8 10 4 22" fill="none" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="spEyesA" fill="#4A4453">
      <circle cx="-7" cy="-13" r="2.6"/><circle cx="7" cy="-13" r="2.6"/>
      <ellipse cx="0" cy="-5" rx="2.8" ry="2.1" fill="#C98C8C"/>
    </g>
    <g id="spEyesB" fill="#4A4453">
      <circle cx="-6" cy="-10" r="2.4"/><circle cx="6" cy="-10" r="2.4"/>
      <ellipse cx="0" cy="-3" rx="2.6" ry="2" fill="#C98C8C"/>
    </g>
    <g id="spEyesL" fill="#4A4453">
      <circle cx="-10" cy="-14" r="2.8"/><circle cx="4" cy="-16" r="2.8"/>
      <path d="M-14 -6 q6 5 12 -1" fill="none" stroke="#4A4453" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 墙与地面 -->
  <rect width="1600" height="900" fill="url(#spWall)"/>
  <rect x="0" y="556" width="1600" height="344" fill="url(#spFloor)"/>
  <g stroke="#4E2F18" stroke-width="2.6" opacity="0.35">
    <path d="M0 578 L1600 578"/><path d="M0 616 L1600 616"/><path d="M0 668 L1600 668"/><path d="M0 740 L1600 740"/>
    <path d="M800 556 L800 900"/><path d="M470 556 L360 900"/><path d="M1130 556 L1240 900"/>
    <path d="M640 556 L580 900"/><path d="M960 556 L1020 900"/>
    <path d="M800 556 L620 900"/><path d="M800 556 L980 900"/>
    <path d="M800 556 L400 900"/><path d="M800 556 L1200 900"/>
  </g>

  <!-- 天花板与木梁 -->
  <rect x="0" y="0" width="1600" height="112" fill="#E4C49E"/>
  <rect x="0" y="102" width="1600" height="14" fill="#C79A6C"/>
  <g fill="#C79A6C" opacity="0.75">
    <rect x="180" y="0" width="16" height="102"/><rect x="500" y="0" width="16" height="102"/>
    <rect x="820" y="0" width="16" height="102"/><rect x="1140" y="0" width="16" height="102"/>
    <rect x="1420" y="0" width="16" height="102"/>
  </g>

  <!-- 后墙上的窗（傍晚的天光，给暖色室内一点冷调对比） -->
  <g>
    <rect x="620" y="140" width="360" height="96" rx="10" fill="url(#spDusk)"/>
    <rect x="620" y="140" width="360" height="96" rx="10" fill="none" stroke="#8A6A50" stroke-width="7"/>
    <path d="M800 140 L800 236" stroke="#8A6A50" stroke-width="6"/>
    <g fill="#FFE9B0" opacity="0.5">
      <circle cx="668" cy="212" r="3"/><circle cx="716" cy="204" r="2.4"/><circle cx="884" cy="210" r="3"/>
      <circle cx="932" cy="202" r="2.4"/><circle cx="760" cy="196" r="2"/>
    </g>
    <circle cx="948" cy="168" r="13" fill="#FFF3D0" opacity="0.85"/>
  </g>
  <!-- 后墙招牌（二十周年的小吊旗） -->
  <g>
    <path d="M540 118 L1060 118" stroke="#8A6A50" stroke-width="4"/>
    <path d="M600 118 l30 26 l-60 0 z" fill="#E8A0A8" opacity="0.95"/>
    <path d="M760 118 l34 30 l-68 0 z" fill="#F3D08A" opacity="0.95"/>
    <path d="M920 118 l34 30 l-68 0 z" fill="#9CC8E8" opacity="0.95"/>
    <circle cx="800" cy="150" r="24" fill="#EFD79A" stroke="#B98F45" stroke-width="2.5"/>
    <text x="800" y="159" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700"
          fill="#6B4A10">20</text>
  </g>

  <!-- 后墙货架（三排玩偶墙） -->
  <g>
    <rect x="470" y="248" width="660" height="316" rx="10" fill="#D9AE82" opacity="0.55"/>
    <g fill="url(#spShelf)">
      <rect x="464" y="292" width="672" height="14" rx="5"/>
      <rect x="464" y="386" width="672" height="14" rx="5"/>
      <rect x="464" y="480" width="672" height="14" rx="5"/>
      <rect x="464" y="560" width="672" height="18" rx="6"/>
    </g>
    <!-- 第 1 排 -->
    <use href="#spBear"  fill="#E8A0A8" transform="translate(512 282) scale(0.8)"/>
    <use href="#spEyesA" transform="translate(512 282) scale(0.8)"/>
    <use href="#spBunny" fill="#F3D08A" transform="translate(608 280) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(608 280) scale(0.8)"/>
    <use href="#spBlob"  fill="#9CC8E8" transform="translate(704 282) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(704 282) scale(0.8)"/>
    <use href="#spLizard" fill="#8FC9B8" transform="translate(800 280) scale(0.85)"/>
    <use href="#spEyesL" transform="translate(800 280) scale(0.85)"/>
    <use href="#spBear"  fill="#C9B8E8" transform="translate(896 282) scale(0.8)"/>
    <use href="#spEyesA" transform="translate(896 282) scale(0.8)"/>
    <use href="#spBunny" fill="#F2BFA6" transform="translate(992 280) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(992 280) scale(0.8)"/>
    <use href="#spBlob"  fill="#EFD79A" transform="translate(1088 282) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(1088 282) scale(0.8)"/>
    <!-- 第 2 排 -->
    <use href="#spBlob"  fill="#D9B0D8" transform="translate(512 376) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(512 376) scale(0.8)"/>
    <use href="#spBear"  fill="#A8D6B0" transform="translate(608 376) scale(0.8)"/>
    <use href="#spEyesA" transform="translate(608 376) scale(0.8)"/>
    <use href="#spBunny" fill="#F6D9C8" transform="translate(704 374) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(704 374) scale(0.8)"/>
    <use href="#spBear"  fill="#B8CBE8" transform="translate(800 376) scale(0.8)"/>
    <use href="#spEyesA" transform="translate(800 376) scale(0.8)"/>
    <use href="#spBlob"  fill="#F2A0AE" transform="translate(896 376) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(896 376) scale(0.8)"/>
    <use href="#spBunny" fill="#C8E0F0" transform="translate(992 374) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(992 374) scale(0.8)"/>
    <use href="#spBear"  fill="#E8CFA0" transform="translate(1088 376) scale(0.8)"/>
    <use href="#spEyesA" transform="translate(1088 376) scale(0.8)"/>
    <!-- 第 3 排 -->
    <use href="#spBunny" fill="#A8C8E8" transform="translate(512 470) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(512 470) scale(0.8)"/>
    <use href="#spBlob"  fill="#E8C8A0" transform="translate(608 470) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(608 470) scale(0.8)"/>
    <use href="#spBear"  fill="#F0B8C8" transform="translate(704 470) scale(0.8)"/>
    <use href="#spEyesA" transform="translate(704 470) scale(0.8)"/>
    <use href="#spBunny" fill="#B0D8C8" transform="translate(800 468) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(800 468) scale(0.8)"/>
    <use href="#spLizard" fill="#9CC8B8" transform="translate(896 470) scale(0.72)"/>
    <use href="#spEyesL" transform="translate(896 470) scale(0.72)"/>
    <use href="#spBlob"  fill="#D8C0E8" transform="translate(992 470) scale(0.8)"/>
    <use href="#spEyesB" transform="translate(992 470) scale(0.8)"/>
    <use href="#spBear"  fill="#EFD79A" transform="translate(1088 470) scale(0.8)"/>
    <use href="#spEyesA" transform="translate(1088 470) scale(0.8)"/>
  </g>

  <!-- 左侧货架（近景，透视） -->
  <g>
    <path d="M40 180 L400 214 L400 590 L40 566 Z" fill="#CEA379" opacity="0.9"/>
    <g fill="url(#spShelf)">
      <path d="M30 300 L408 322 L408 340 L30 320 Z"/>
      <path d="M30 414 L408 432 L408 450 L30 432 Z"/>
      <path d="M30 528 L408 540 L408 560 L30 550 Z"/>
    </g>
    <use href="#spBear"  fill="#F0B8C8" transform="translate(120 296) scale(0.92)"/>
    <use href="#spEyesA" transform="translate(120 296) scale(0.92)"/>
    <use href="#spBunny" fill="#A8D6B0" transform="translate(232 304) scale(0.9)"/>
    <use href="#spEyesB" transform="translate(232 304) scale(0.9)"/>
    <use href="#spBlob"  fill="#9CC8E8" transform="translate(344 312) scale(0.88)"/>
    <use href="#spEyesB" transform="translate(344 312) scale(0.88)"/>
    <use href="#spBunny" fill="#EFD79A" transform="translate(120 410) scale(0.92)"/>
    <use href="#spEyesB" transform="translate(120 410) scale(0.92)"/>
    <use href="#spLizard" fill="#8FC9B8" transform="translate(232 418) scale(0.9)"/>
    <use href="#spEyesL" transform="translate(232 418) scale(0.9)"/>
    <use href="#spBear"  fill="#D9B0D8" transform="translate(344 426) scale(0.88)"/>
    <use href="#spEyesA" transform="translate(344 426) scale(0.88)"/>
    <use href="#spBlob"  fill="#F2A0AE" transform="translate(120 524) scale(0.92)"/>
    <use href="#spEyesB" transform="translate(120 524) scale(0.92)"/>
    <use href="#spBear"  fill="#C8E0F0" transform="translate(232 532) scale(0.9)"/>
    <use href="#spEyesA" transform="translate(232 532) scale(0.9)"/>
    <use href="#spBunny" fill="#E8C8A0" transform="translate(344 540) scale(0.88)"/>
    <use href="#spEyesB" transform="translate(344 540) scale(0.88)"/>
  </g>

  <!-- 右侧货架（近景，透视） -->
  <g>
    <path d="M1560 180 L1200 214 L1200 590 L1560 566 Z" fill="#CEA379" opacity="0.9"/>
    <g fill="url(#spShelf)">
      <path d="M1570 300 L1192 322 L1192 340 L1570 320 Z"/>
      <path d="M1570 414 L1192 432 L1192 450 L1570 432 Z"/>
      <path d="M1570 528 L1192 540 L1192 560 L1570 550 Z"/>
    </g>
    <use href="#spBear"  fill="#B0D8C8" transform="translate(1480 296) scale(0.92)"/>
    <use href="#spEyesA" transform="translate(1480 296) scale(0.92)"/>
    <use href="#spBunny" fill="#F0B8C8" transform="translate(1368 304) scale(0.9)"/>
    <use href="#spEyesB" transform="translate(1368 304) scale(0.9)"/>
    <use href="#spBlob"  fill="#EFD79A" transform="translate(1256 312) scale(0.88)"/>
    <use href="#spEyesB" transform="translate(1256 312) scale(0.88)"/>
    <use href="#spBlob"  fill="#A8C8E8" transform="translate(1480 410) scale(0.92)"/>
    <use href="#spEyesB" transform="translate(1480 410) scale(0.92)"/>
    <use href="#spBear"  fill="#F2A0AE" transform="translate(1368 418) scale(0.9)"/>
    <use href="#spEyesA" transform="translate(1368 418) scale(0.9)"/>
    <use href="#spBunny" fill="#C9B8E8" transform="translate(1256 426) scale(0.88)"/>
    <use href="#spEyesB" transform="translate(1256 426) scale(0.88)"/>
    <use href="#spBunny" fill="#F6D9C8" transform="translate(1480 524) scale(0.92)"/>
    <use href="#spEyesB" transform="translate(1480 524) scale(0.92)"/>
    <use href="#spBlob"  fill="#8FC9B8" transform="translate(1368 532) scale(0.9)"/>
    <use href="#spEyesB" transform="translate(1368 532) scale(0.9)"/>
    <use href="#spBear"  fill="#E8CFA0" transform="translate(1256 540) scale(0.88)"/>
    <use href="#spEyesA" transform="translate(1256 540) scale(0.88)"/>
  </g>

  <!-- 吊灯（三盏，暖光） -->
  <g>
    <g>
      <path d="M360 0 L360 78" stroke="#8A6A50" stroke-width="3.4"/>
      <path d="M326 78 L394 78 L382 108 L338 108 Z" fill="#C79A6C" stroke="#8A6A50" stroke-width="2.4"/>
      <circle cx="360" cy="116" r="12" fill="#FFF2CC"/>
      <circle cx="360" cy="116" r="70" fill="url(#spLamp)"/>
    </g>
    <g>
      <path d="M800 0 L800 54" stroke="#8A6A50" stroke-width="3.4"/>
      <path d="M762 54 L838 54 L824 88 L776 88 Z" fill="#C79A6C" stroke="#8A6A50" stroke-width="2.4"/>
      <circle cx="800" cy="96" r="13" fill="#FFF2CC"/>
      <circle cx="800" cy="96" r="82" fill="url(#spLamp)"/>
    </g>
    <g>
      <path d="M1240 0 L1240 78" stroke="#8A6A50" stroke-width="3.4"/>
      <path d="M1206 78 L1274 78 L1262 108 L1218 108 Z" fill="#C79A6C" stroke="#8A6A50" stroke-width="2.4"/>
      <circle cx="1240" cy="116" r="12" fill="#FFF2CC"/>
      <circle cx="1240" cy="116" r="70" fill="url(#spLamp)"/>
    </g>
  </g>

  <!-- 柜台（左前） -->
  <g>
    <path d="M60 590 L520 570 L520 646 L60 662 Z" fill="#B98A5E"/>
    <path d="M60 590 L520 570 L520 590 L60 610 Z" fill="#D2A576"/>
    <g fill="#A87A50" opacity="0.8">
      <path d="M120 604 L120 656 M220 598 L220 652 M320 594 L320 650 M420 590 L420 648" stroke="#96683F" stroke-width="6"/>
    </g>
    <g>
      <ellipse cx="470" cy="586" rx="26" ry="9" fill="#E8C065" stroke="#B98F45" stroke-width="2"/>
      <path d="M470 578 q10 -14 20 -4" stroke="#B98F45" stroke-width="3" fill="none"/>
      <rect x="150" y="556" width="70" height="16" rx="4" fill="#F6E7D2" stroke="#C9A87E" stroke-width="2"/>
    </g>
  </g>

  <!-- 暖光与暗角 -->
  <!-- 地面上的货架阴影与吊灯反光（把"室内"压出层次） -->
  <path d="M40 566 L400 590 L400 616 L40 600 Z" fill="#3A2414" opacity="0.22"/>
  <path d="M1560 566 L1200 590 L1200 616 L1560 600 Z" fill="#3A2414" opacity="0.22"/>
  <path d="M464 578 L1136 578 L1150 622 L450 622 Z" fill="#3A2414" opacity="0.2"/>
  <g opacity="0.5">
    <ellipse cx="360" cy="670" rx="170" ry="48" fill="url(#spLamp)"/>
    <ellipse cx="800" cy="680" rx="200" ry="54" fill="url(#spLamp)"/>
    <ellipse cx="1240" cy="670" rx="170" ry="48" fill="url(#spLamp)"/>
  </g>
  <rect x="0" y="556" width="1600" height="26" fill="#4E2F18" opacity="0.16"/>
  <rect width="1600" height="900" fill="url(#spWarmth)"/>
  <rect width="1600" height="900" fill="url(#spVig)"/>

</svg>
