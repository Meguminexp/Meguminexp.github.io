<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- hk_parade.svg · 仙境巡游 · 午后的大街 · 手写矢量，1600×900
       可视带：游戏内对话框会盖住 y ≈ 622 以下，主体（花车 / 建筑 / 彩带）全部压在这条线以上。 -->
  <defs>
    <linearGradient id="pdSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CCBE8"/><stop offset="0.34" stop-color="#CFE3EE"/>
      <stop offset="0.62" stop-color="#FBE6C4"/><stop offset="1" stop-color="#FFD79B"/>
    </linearGradient>
    <radialGradient id="pdSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D2" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFE7A8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pdRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8BC96"/><stop offset="1" stop-color="#BFA17C"/>
    </linearGradient>
    <linearGradient id="pdBuildL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6E3D2"/><stop offset="1" stop-color="#E3C4AE"/>
    </linearGradient>
    <linearGradient id="pdBuildR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F1DFCE"/><stop offset="1" stop-color="#D9B7A2"/>
    </linearGradient>
    <linearGradient id="pdFloat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0F4"/><stop offset="1" stop-color="#E9C3CE"/>
    </linearGradient>
    <linearGradient id="pdCup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EF"/><stop offset="0.55" stop-color="#F3DFE6"/>
      <stop offset="1" stop-color="#D9AEBC"/>
    </linearGradient>
    <linearGradient id="pdGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEDB4"/><stop offset="0.5" stop-color="#E9C167"/>
      <stop offset="1" stop-color="#BB8C33"/>
    </linearGradient>
    <radialGradient id="pdGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF2C8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF2C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pdVig" cx="0.5" cy="0.44" r="0.82">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3A2A18" stop-opacity="0.24"/>
    </radialGradient>
    <g id="pdPerson">
      <path d="M-18 -42 q18 -9 36 0 l5 40 q-23 5 -46 0 z" fill="#4E4450"/>
      <path d="M-19 -38 q-8 16 -6 33 M19 -38 q8 16 6 33" fill="none" stroke="#4E4450" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="-56" r="12.5" fill="#4E4450"/>
    </g>
    <!-- 举着手机的手（巡游里几乎人人都在拍） -->
    <g id="pdPersonPhone">
      <use href="#pdPerson"/>
      <path d="M14 -40 l16 -30" stroke="#4E4450" stroke-width="7" stroke-linecap="round"/>
      <rect x="26" y="-84" width="13" height="20" rx="3" fill="#FFF0C8" opacity="0.9"/>
    </g>
  </defs>

  <!-- 天空与夕照 -->
  <rect width="1600" height="900" fill="url(#pdSky)"/>
  <circle cx="1210" cy="200" r="440" fill="url(#pdSun)"/>
  <g fill="#FFFFFF" opacity="0.5">
    <ellipse cx="360" cy="132" rx="150" ry="30"/><ellipse cx="470" cy="118" rx="96" ry="26"/>
    <ellipse cx="1180" cy="112" rx="130" ry="24"/><ellipse cx="1060" cy="126" rx="80" ry="20"/>
  </g>
  <!-- 街道尽头的远景：暖雾里的小城堡 -->
  <ellipse cx="800" cy="466" rx="340" ry="126" fill="url(#pdGlow)"/>
  <ellipse cx="800" cy="486" rx="210" ry="62" fill="#FFF0CE" opacity="0.32"/>

  <!-- 左右两侧的建筑（近大远小） -->
  <g>
    <!-- 左侧近景 -->
    <path d="M0 130 L250 176 L250 640 L0 662 Z" fill="url(#pdBuildL)"/>
    <path d="M0 130 L250 176 L250 196 L0 152 Z" fill="#C79E86"/>
    <path d="M118 166 L262 192 L262 216 L118 190 Z" fill="#D98A93"/>
    <path d="M118 216 L262 214 L262 224 L118 226 Z" fill="#B97781"/>
    <g fill="#8FB6C9">
      <rect x="34" y="262" width="46" height="60" rx="4"/><rect x="104" y="272" width="46" height="60" rx="4"/>
      <rect x="176" y="280" width="46" height="60" rx="4"/>
      <rect x="34" y="368" width="46" height="60" rx="4"/><rect x="104" y="378" width="46" height="60" rx="4"/>
      <rect x="176" y="386" width="46" height="60" rx="4"/>
      <rect x="34" y="474" width="46" height="60" rx="4"/><rect x="104" y="484" width="46" height="60" rx="4"/>
      <rect x="176" y="492" width="46" height="60" rx="4"/>
    </g>
    <g fill="#A8CBDB" opacity="0.85">
      <rect x="34" y="262" width="46" height="20" rx="4"/><rect x="104" y="272" width="46" height="20" rx="4"/>
      <rect x="176" y="280" width="46" height="20" rx="4"/><rect x="34" y="368" width="46" height="20" rx="4"/>
      <rect x="104" y="378" width="46" height="20" rx="4"/><rect x="176" y="386" width="46" height="20" rx="4"/>
      <rect x="34" y="474" width="46" height="20" rx="4"/><rect x="104" y="484" width="46" height="20" rx="4"/>
      <rect x="176" y="492" width="46" height="20" rx="4"/>
    </g>
    <!-- 右侧近景 -->
    <path d="M1600 130 L1350 176 L1350 640 L1600 662 Z" fill="url(#pdBuildR)"/>
    <path d="M1600 130 L1350 176 L1350 196 L1600 152 Z" fill="#C79E86"/>
    <path d="M1482 166 L1338 192 L1338 216 L1482 190 Z" fill="#7FAFA6"/>
    <path d="M1482 216 L1338 214 L1338 224 L1482 226 Z" fill="#6A968E"/>
    <g fill="#8FB6C9">
      <rect x="1520" y="262" width="46" height="60" rx="4"/><rect x="1450" y="272" width="46" height="60" rx="4"/>
      <rect x="1378" y="280" width="46" height="60" rx="4"/>
      <rect x="1520" y="368" width="46" height="60" rx="4"/><rect x="1450" y="378" width="46" height="60" rx="4"/>
      <rect x="1378" y="386" width="46" height="60" rx="4"/>
      <rect x="1520" y="474" width="46" height="60" rx="4"/><rect x="1450" y="484" width="46" height="60" rx="4"/>
      <rect x="1378" y="492" width="46" height="60" rx="4"/>
    </g>
    <g fill="#A8CBDB" opacity="0.85">
      <rect x="1520" y="262" width="46" height="20" rx="4"/><rect x="1450" y="272" width="46" height="20" rx="4"/>
      <rect x="1378" y="280" width="46" height="20" rx="4"/><rect x="1520" y="368" width="46" height="20" rx="4"/>
      <rect x="1450" y="378" width="46" height="20" rx="4"/><rect x="1378" y="386" width="46" height="20" rx="4"/>
      <rect x="1520" y="474" width="46" height="20" rx="4"/><rect x="1450" y="484" width="46" height="20" rx="4"/>
      <rect x="1378" y="492" width="46" height="20" rx="4"/>
    </g>
    <!-- 雨棚 -->
    <g fill="#D98A93" opacity="0.95">
      <path d="M0 240 L262 208 L262 232 L0 272 Z"/>
      <path d="M1600 240 L1338 208 L1338 232 L1600 272 Z" fill="#7FAFA6"/>
    </g>
  </g>

  <!-- 街上的彩旗（bunting） -->
  <g>
    <path d="M250 214 Q800 262 1350 214" stroke="#8A6A50" stroke-width="3.4" fill="none"/>
    <g>
      <path d="M300 232 l22 4 l-14 26 z" fill="#E88A9A"/><path d="M400 258 l22 4 l-14 26 z" fill="#F7D27A"/>
      <path d="M500 278 l22 4 l-14 26 z" fill="#8FC9EE"/><path d="M600 293 l22 4 l-14 26 z" fill="#A9D6A2"/>
      <path d="M700 303 l22 4 l-14 26 z" fill="#E88A9A"/><path d="M800 306 l22 4 l-14 26 z" fill="#F7D27A"/>
      <path d="M900 303 l22 4 l-14 26 z" fill="#8FC9EE"/><path d="M1000 293 l22 4 l-14 26 z" fill="#A9D6A2"/>
      <path d="M1100 278 l22 4 l-14 26 z" fill="#E88A9A"/><path d="M1200 258 l22 4 l-14 26 z" fill="#F7D27A"/>
      <path d="M1290 234 l22 4 l-14 26 z" fill="#8FC9EE"/>
    </g>
  </g>

  <!-- 路面 -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#pdRoad)"/>
  <g stroke="#A98A67" stroke-width="2.4" opacity="0.6">
    <path d="M0 654 L1600 654"/><path d="M0 706 L1600 706"/><path d="M0 780 L1600 780"/>
    <path d="M250 620 L120 900"/><path d="M1350 620 L1480 900"/>
    <path d="M800 620 L800 900"/>
  </g>
  <!-- 地上的纸屑与花车的投影 -->
  <ellipse cx="800" cy="652" rx="290" ry="22" fill="#8A6A48" opacity="0.25"/>
  <g opacity="0.75">
    <rect x="404" y="660" width="14" height="8" rx="3" fill="#E88A9A" transform="rotate(22 411 664)"/>
    <rect x="486" y="686" width="14" height="8" rx="3" fill="#F7D27A" transform="rotate(-26 493 690)"/>
    <rect x="592" y="666" width="14" height="8" rx="3" fill="#8FC9EE" transform="rotate(36 599 670)"/>
    <rect x="1080" y="664" width="14" height="8" rx="3" fill="#A9D6A2" transform="rotate(-18 1087 668)"/>
    <rect x="1176" y="690" width="14" height="8" rx="3" fill="#E88A9A" transform="rotate(28 1183 694)"/>
    <rect x="1290" y="662" width="14" height="8" rx="3" fill="#F7D27A" transform="rotate(-34 1297 666)"/>
    <rect x="300" y="692" width="14" height="8" rx="3" fill="#8FC9EE" transform="rotate(14 307 696)"/>
    <rect x="920" y="694" width="14" height="8" rx="3" fill="#A9D6A2" transform="rotate(-22 927 698)"/>
    <ellipse cx="700" cy="676" rx="16" ry="5" fill="#C9A24E" opacity="0.4"/>
    <ellipse cx="1004" cy="680" rx="14" ry="4" fill="#8FC9EE" opacity="0.4"/>
  </g>

  <!-- ============ 花车（仙境茶会） ============ -->
  <g>
    <!-- 车台 -->
    <path d="M556 596 L1044 596 L1030 632 L570 632 Z" fill="#C9A24E"/>
    <path d="M566 632 L1034 632 L1034 646 L566 646 Z" fill="#A8813A"/>
    <g fill="#6E5A3E">
      <circle cx="636" cy="648" r="24"/><circle cx="800" cy="648" r="24"/><circle cx="964" cy="648" r="24"/>
      <circle cx="636" cy="648" r="10" fill="#C9A24E"/><circle cx="800" cy="648" r="10" fill="#C9A24E"/>
      <circle cx="964" cy="648" r="10" fill="#C9A24E"/>
    </g>
    <!-- 车台上的花与蘑菇 -->
    <g>
      <ellipse cx="628" cy="592" rx="46" ry="16" fill="#8FB86E"/>
      <path d="M592 592 q0 -34 36 -34 q36 0 36 34 z" fill="#E88A9A"/>
      <g fill="#FFF6E0"><circle cx="608" cy="576" r="5"/><circle cx="628" cy="566" r="6"/><circle cx="650" cy="578" r="5"/></g>
      <rect x="618" y="586" width="20" height="14" rx="6" fill="#F3E3CE"/>
      <ellipse cx="972" cy="592" rx="46" ry="16" fill="#8FB86E"/>
      <path d="M936 592 q0 -34 36 -34 q36 0 36 34 z" fill="#8FC9EE"/>
      <g fill="#FFF6E0"><circle cx="952" cy="576" r="5"/><circle cx="972" cy="566" r="6"/><circle cx="994" cy="578" r="5"/></g>
      <rect x="962" y="586" width="20" height="14" rx="6" fill="#F3E3CE"/>
    </g>
    <!-- 巨大的茶杯（仙境茶会）：杯身更高、有杯沿、下面是碟子 -->
    <g>
      <ellipse cx="800" cy="588" rx="150" ry="24" fill="#E4CBD4"/>
      <ellipse cx="800" cy="578" rx="134" ry="20" fill="#F6E4E8"/>
      <path d="M676 566 q-6 -84 24 -104 q42 -26 100 -26 q58 0 100 26 q30 20 24 104 q-4 40 -124 40 q-120 0 -124 -40 z"
            fill="url(#pdCup)" stroke="#D0A6B4" stroke-width="3"/>
      <ellipse cx="800" cy="462" rx="124" ry="26" fill="#FBEFF2"/>
      <ellipse cx="800" cy="462" rx="104" ry="19" fill="#EED2DC"/>
      <ellipse cx="800" cy="462" rx="86" ry="14" fill="#E4AEBD"/>
      <path d="M966 500 q44 -4 42 26 q-2 28 -46 24" fill="none" stroke="#D0A6B4" stroke-width="15"/>
      <path d="M966 500 q44 -4 42 26 q-2 28 -46 24" fill="none" stroke="#FBEFF2" stroke-width="8"/>
      <!-- 杯口的白瓷高光 -->
      <path d="M676 566 q-4 -60 14 -88 q-30 34 -24 92 z" fill="#FFFFFF" opacity="0.5"/>
      <!-- 杯身的笑脸 -->
      <g fill="#7A5566" opacity="0.7">
        <circle cx="770" cy="524" r="7"/><circle cx="834" cy="524" r="7"/>
        <path d="M778 542 q24 16 48 0" stroke="#7A5566" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 杯中的「仙境」：转动的茶汤与小纸伞 -->
      <g opacity="0.95">
        <path d="M744 456 l18 -30 l18 30 z" fill="#FFF6E0" stroke="#E0C79A" stroke-width="2"/>
        <path d="M836 454 l18 -30 l18 30 z" fill="#FFF6E0" stroke="#E0C79A" stroke-width="2"/>
        <path d="M762 440 l-4 20 M854 438 l-4 20" stroke="#C08A9A" stroke-width="3"/>
      </g>
    </g>
    <!-- 车顶的纸城堡与旗 -->
    <g>
      <path d="M762 434 L762 356 L792 376 L822 336 L852 376 L882 356 L882 434 Z" fill="#FFF2F5" stroke="#D8B7C4" stroke-width="2.4"/>
      <path d="M762 356 L792 376 L822 336 L852 376 L882 356 L882 372 L762 372 Z" fill="#E8A9BB"/>
      <circle cx="822" cy="398" r="13" fill="#F8EEF0" stroke="#C9A24E" stroke-width="3"/>
      <path d="M822 434 L822 300" stroke="#C9A24E" stroke-width="4"/>
      <path d="M822 306 l34 14 l-34 14 z" fill="url(#pdGold)"/>
    </g>
    <!-- 悬浮的扑克牌 -->
    <g opacity="0.95">
      <g transform="translate(660 430) rotate(-16)">
        <rect x="-22" y="-32" width="44" height="64" rx="6" fill="#FFF8F2" stroke="#C08A9A" stroke-width="2.4"/>
        <path d="M0 -14 l10 14 l-10 14 l-10 -14 z" fill="#D9707F"/>
      </g>
      <g transform="translate(940 418) rotate(14)">
        <rect x="-22" y="-32" width="44" height="64" rx="6" fill="#FFF8F2" stroke="#C08A9A" stroke-width="2.4"/>
        <path d="M-10 -12 q10 -12 20 0 q-10 12 -20 0 z" fill="#5C5170"/>
      </g>
    </g>
  </g>

  <!-- 彩带 / 纸屑 / 泡泡 -->
  <g>
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M300 470 q40 -30 84 -4 q40 24 74 -6" stroke="#E88A9A"/>
      <path d="M1180 448 q42 -28 86 -2 q38 22 72 -8" stroke="#8FC9EE"/>
      <path d="M180 360 q36 -22 74 -2" stroke="#F7D27A"/>
      <path d="M1360 372 q38 -24 78 -4" stroke="#A9D6A2"/>
    </g>
    <g opacity="0.85">
      <rect x="420" y="330" width="12" height="7" rx="3" fill="#E88A9A" transform="rotate(24 426 334)"/>
      <rect x="520" y="392" width="12" height="7" rx="3" fill="#F7D27A" transform="rotate(-18 526 396)"/>
      <rect x="640" y="330" width="12" height="7" rx="3" fill="#8FC9EE" transform="rotate(40 646 334)"/>
      <rect x="1010" y="346" width="12" height="7" rx="3" fill="#A9D6A2" transform="rotate(-32 1016 350)"/>
      <rect x="1120" y="396" width="12" height="7" rx="3" fill="#E88A9A" transform="rotate(18 1126 400)"/>
      <rect x="1240" y="330" width="12" height="7" rx="3" fill="#F7D27A" transform="rotate(-24 1246 334)"/>
      <rect x="880" y="300" width="12" height="7" rx="3" fill="#8FC9EE" transform="rotate(12 886 304)"/>
      <rect x="720" y="268" width="12" height="7" rx="3" fill="#E88A9A" transform="rotate(-40 726 272)"/>
      <rect x="960" y="252" width="12" height="7" rx="3" fill="#F7D27A" transform="rotate(28 966 256)"/>
      <rect x="560" y="246" width="12" height="7" rx="3" fill="#A9D6A2" transform="rotate(-14 566 250)"/>
    </g>
    <g fill="#FFFFFF" opacity="0.5">
      <circle cx="470" cy="300" r="15"/><circle cx="470" cy="300" r="9" fill="#FFF6E0" opacity="0.5"/>
      <circle cx="1060" cy="268" r="20"/><circle cx="1060" cy="268" r="12" fill="#FFF6E0" opacity="0.5"/>
      <circle cx="1330" cy="430" r="13"/><circle cx="1330" cy="430" r="8" fill="#FFF6E0" opacity="0.5"/>
      <circle cx="240" cy="452" r="17"/><circle cx="240" cy="452" r="10" fill="#FFF6E0" opacity="0.5"/>
      <circle cx="760" cy="222" r="11"/><circle cx="760" cy="222" r="6" fill="#FFF6E0" opacity="0.5"/>
    </g>
  </g>

  <!-- 人群（沿街坐着与站着，控制在可视带内） -->
  <g opacity="0.92">
    <use href="#pdPerson" transform="translate(300 604) scale(1)"/>
    <use href="#pdPersonPhone" transform="translate(360 612) scale(0.94)"/>
    <use href="#pdPerson" transform="translate(428 606) scale(0.9)"/>
    <use href="#pdPersonPhone" transform="translate(1196 604) scale(1)"/>
    <use href="#pdPerson" transform="translate(1260 610) scale(0.92)"/>
    <use href="#pdPerson" transform="translate(1324 604) scale(0.86)"/>
    <use href="#pdPerson" transform="translate(190 616) scale(0.82)"/>
    <use href="#pdPerson" transform="translate(1420 618) scale(0.8)"/>
  </g>
  <g opacity="0.5" fill="#4E4450">
    <use href="#pdPerson" transform="translate(520 640) scale(0.66)"/>
    <use href="#pdPerson" transform="translate(1080 640) scale(0.66)"/>
    <use href="#pdPerson" transform="translate(800 660) scale(0.6)"/>
  </g>

  <!-- 逆光与暗角 -->
  <ellipse cx="1210" cy="200" rx="700" ry="420" fill="url(#pdGlow)"/>
  <rect width="1600" height="900" fill="url(#pdVig)"/>

</svg>
