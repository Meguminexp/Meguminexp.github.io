<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星尘守卫 · 爱心小角落塔防</title>
<style>
/* ============================================================
   [0] 样式 — 星尘守卫 v3（肉鸽塔防重制版）
   布局: 顶部信息条 / 游戏画布 / 底部 HUD / 弹层
   ============================================================ */
:root{
  --bg0:#1c1640; --bg1:#2b2450; --gold:#ffd66b; --gold2:#ffe9a8;
  --pink:#ffb7c5; --pink2:#ff8fa3; --mint:#7fd8c0; --teal:#4ecdc4;
  --lav:#b8a7ff; --lav2:#9b8bff; --sand:#f2e2b8; --sand2:#e0c088;
  --grass:#8bd46a; --grass2:#6fbf52; --hp:#ff5b5b; --hpbg:#4a2f45;
  --ink:#e8e4f0; --inkdim:#a09ab8; --panel:rgba(20,16,48,.95);
  --frame:#3a3168; --frame2:#6a5cb0;
  --rare-c:#7fd8c0; --rare-u:#b8a7ff; --rare-r:#ffd66b; --rare-e:#ff8fa3;
  --danger:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{
  font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  background:radial-gradient(ellipse at 50% 20%,#2b2450 0%,#1c1640 55%,#14102f 100%);
  color:var(--ink); overflow:hidden; display:flex; align-items:center; justify-content:center;
}
#wrap{position:relative; width:960px; max-width:96vw; image-rendering:pixelated;}
canvas#game{
  width:100%; height:auto; display:block; border-radius:10px;
  box-shadow:0 0 0 3px var(--frame),0 0 0 6px var(--frame2),0 10px 40px rgba(0,0,0,.5);
  background:var(--bg1); image-rendering:pixelated; cursor:crosshair;
}

/* ================= 顶部信息条 ================= */
#topbar{
  width:100%; height:32px; margin-bottom:5px; display:flex; align-items:center; gap:10px;
  padding:0 10px; background:var(--panel); border-radius:8px; font-size:13px;
  box-shadow:0 0 0 2px var(--frame); letter-spacing:1px;
}
#topbar .tb-item{display:flex; align-items:center; gap:5px; white-space:nowrap}
#topbar .tb-item b{color:var(--gold)}
#topbar .tb-chapter{font-weight:700}
#topbar .tb-event{color:var(--lav); font-weight:700}
#topbar .tb-progress{flex:1; height:8px; background:rgba(255,255,255,.08); border-radius:5px;
  overflow:hidden; border:1px solid var(--frame2)}
#topbar .tb-progress i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#6a5cb0,#ffd66b);
  border-radius:5px; transition:width .25s}
#topbar .tb-prev{display:flex; gap:3px; align-items:center}
#topbar .tb-prev span{font-size:15px; line-height:1}

/* ================= HUD（底部） ================= */
#hud{
  position:relative; margin-top:6px; min-height:104px;
  display:flex; flex-direction:column; gap:4px; padding:6px 8px;
  background:var(--panel); border-radius:10px;
  box-shadow:0 0 0 2px var(--frame),0 4px 16px rgba(0,0,0,.4);
  z-index:6;
}
#hud .hrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
#hud .stat{display:flex; align-items:center; gap:5px; font-size:13px; padding:3px 8px;
  background:rgba(255,255,255,.06); border-radius:8px; white-space:nowrap;}
#hud .stat b{color:var(--gold); font-size:15px}
#hud .spacer{flex:1}
.tbtn{
  font-family:inherit; cursor:pointer; border:0; border-radius:8px; padding:5px 10px;
  background:linear-gradient(180deg,#6a5cb0,#4a3d8c); color:var(--ink); font-size:13px;
  box-shadow:0 2px 0 #2f2866; transition:filter .12s,transform .06s; position:relative;
}
.tbtn:hover{filter:brightness(1.15)}
.tbtn:active{transform:translateY(2px); box-shadow:0 0 0 #2f2866}
.tbtn.locked{opacity:.45; filter:grayscale(.7)}
.tbtn.go{background:linear-gradient(180deg,#ffd66b,#e8a838); color:#3a2b00; font-weight:700; box-shadow:0 2px 0 #b8891f}
.tbtn.danger{background:linear-gradient(180deg,#ff8fa3,#e06080); color:#3d0a14}
.tbtn small{display:block; font-size:10px; opacity:.75; line-height:1}
.tbtn .hotkey{position:absolute; top:-6px; left:-6px; width:15px; height:15px; font-size:10px;
  background:#2f2866; border:1px solid var(--frame2); border-radius:4px; display:flex;
  align-items:center; justify-content:center; color:var(--gold2); font-weight:700}
/* 塔建造卡片 */
.tcard{
  font-family:inherit; cursor:pointer; border:2px solid var(--frame); border-radius:9px;
  background:rgba(255,255,255,.05); color:var(--ink); padding:4px 8px; min-width:76px;
  display:flex; flex-direction:column; align-items:center; gap:1px; position:relative;
  transition:transform .1s, filter .12s, border-color .1s;
}
.tcard:hover{transform:translateY(-2px); filter:brightness(1.12)}
.tcard .tic{font-size:20px; line-height:1.1}
.tcard .tn{font-size:11.5px; font-weight:700}
.tcard .tc{font-size:10.5px; color:var(--gold)}
.tcard.armed{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold2),0 0 12px rgba(255,214,107,.35); transform:translateY(-2px)}
.tcard.locked{opacity:.4; filter:grayscale(.75); cursor:not-allowed}
.tcard.poor{opacity:.6; filter:saturate(.7)}
.tcard .hotkey{position:absolute; top:-6px; left:-6px; width:15px; height:15px; font-size:10px;
  background:#2f2866; border:1px solid var(--frame2); border-radius:4px; display:flex;
  align-items:center; justify-content:center; color:var(--gold2); font-weight:700}
/* 选中塔面板 */
.tpanel{
  flex:1; display:flex; align-items:center; gap:10px; padding:4px 10px;
  background:rgba(255,255,255,.06); border:1px solid var(--frame2); border-radius:10px; min-height:54px;
}
.tpanel .tp-main{min-width:150px}
.tpanel .tp-name{font-weight:700; font-size:14px; color:var(--gold2)}
.tpanel .tp-name small{color:var(--inkdim); font-size:11px}
.tpanel .tp-stats{display:grid; grid-template-columns:auto auto auto; gap:2px 14px; font-size:11.5px; color:var(--inkdim)}
.tpanel .tp-stats b{color:var(--ink)}
.tpanel .tp-up{display:flex; flex-direction:column; align-items:center; font-size:11px; color:var(--inkdim)}
.tpanel .tp-up b{color:var(--grass); font-size:12px}
.tpanel .tp-actions{display:flex; flex-direction:column; gap:4px; margin-left:auto}

/* ================= 弹层 ================= */
.overlay{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  background:rgba(10,8,28,.74); border-radius:10px; z-index:20;
}
.overlay.show{display:flex}
.panel{
  background:var(--panel); border-radius:14px; padding:20px 24px; max-width:860px; width:94%;
  max-height:94%; overflow-y:auto; scrollbar-width:thin;
  box-shadow:0 0 0 3px var(--frame),0 0 0 6px var(--frame2),0 20px 60px rgba(0,0,0,.6);
  text-align:center;
}
.panel h2{color:var(--gold); font-size:24px; margin-bottom:4px; letter-spacing:2px; text-shadow:0 0 18px rgba(255,214,107,.5)}
.panel .sub{color:var(--inkdim); font-size:13px; margin-bottom:14px}
.panel .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:12px 0; align-items:stretch}

/* 三选一卡片: 稀有度描边 + 色条 + 类型徽章 + 已选计数 */
.pick{
  width:196px; cursor:pointer; border-radius:14px; text-align:center;
  background:rgba(255,255,255,.05); border:2px solid var(--frame);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
  transition:transform .1s, box-shadow .1s;
}
.pick:hover{transform:translateY(-4px) scale(1.02); box-shadow:0 10px 24px rgba(0,0,0,.35)}
.pick.rarity-common{border-color:var(--rare-c)}
.pick.rarity-uncommon{border-color:var(--rare-u)}
.pick.rarity-rare{border-color:var(--rare-r); box-shadow:0 0 0 1px var(--rare-r)}
.pick.rarity-epic{border-color:var(--rare-e); box-shadow:0 0 0 1px var(--rare-e),0 0 14px rgba(255,143,163,.25)}
.pick.danger{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger),0 0 12px rgba(255,107,107,.2)}
.pick .phead{height:6px; flex:0 0 6px}
.pick .pbody{padding:12px 10px 14px; display:flex; flex-direction:column; align-items:center; flex:1}
.pick .prarity{position:absolute; top:10px; right:10px; font-size:10px; font-weight:700;
  padding:2px 8px; border-radius:9px; color:#1a1230; border:1px solid rgba(0,0,0,.25)}
.pick .ptype{position:absolute; top:10px; left:10px; font-size:9.5px; font-weight:700; padding:2px 7px;
  border-radius:9px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18)}
.pick .picon{font-size:34px; line-height:1.1; margin-top:14px}
.pick .pname{font-weight:700; font-size:14.5px; color:var(--ink); margin-top:8px}
.pick .pdesc{font-size:11.5px; color:var(--inkdim); margin-top:6px; line-height:1.55;
  flex:1; display:flex; align-items:center; justify-content:center; max-width:176px}
.pick .pdesc b{color:var(--gold)}
.pick .pcount{font-size:10.5px; color:var(--inkdim); opacity:.8; margin-top:6px}
.pick.dim{opacity:.55; cursor:default}
.pick.dim:hover{transform:none}

/* 世界地图章节卡片 */
.worldcard{width:150px; cursor:pointer; border-radius:12px; padding:12px 8px; text-align:center; flex:0 0 auto;
  background:rgba(255,255,255,.05); border:3px solid var(--frame); transition:transform .1s, box-shadow .1s;}
.worldcard:hover{transform:translateY(-3px)}
.worldcard .wicon{font-size:34px; line-height:1; margin-bottom:6px; display:inline-block; padding:6px;
  border-radius:12px; border:2px solid var(--frame2); background:rgba(0,0,0,.25)}
.worldcard .wname{font-weight:700; font-size:14px; color:var(--ink)}
.worldcard .wtheme{font-size:10.5px; color:var(--inkdim); margin-top:4px; line-height:1.4}
.worldcard .wstatus{font-size:11px; font-weight:700; margin-top:6px}
.worldcard.wcur{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold2),0 4px 16px rgba(255,214,107,.25)}
.worldcard.wcur .wstatus{color:var(--gold)}
.worldcard.wclear{opacity:.78} .worldcard.wclear .wstatus{color:var(--mint)}
.worldcard.wlock{opacity:.4; filter:grayscale(.7)} .worldcard.wlock .wstatus{color:var(--inkdim)}
.shopgroup{width:100%; text-align:left; font-size:12.5px; color:var(--inkdim); letter-spacing:1px;
  margin:14px 0 2px; padding:0 2px 6px; border-bottom:1px solid var(--frame2)}
.shopcard{
  width:142px; cursor:pointer; border-radius:12px; padding:8px 4px; text-align:center;
  background:rgba(255,255,255,.05); border:2px solid var(--frame);
  display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:transform .12s, filter .12s;
}
.shopcard:hover{transform:translateY(-3px); filter:brightness(1.12)}
.shopcard .sicon{font-size:26px}
.shopcard .sname{font-weight:700; font-size:12.5px; margin-top:3px}
.shopcard .sdesc{font-size:10.5px; color:var(--inkdim); line-height:1.4; min-height:24px;
  flex:1; display:flex; align-items:center; justify-content:center}
.shopcard .sprice{color:var(--gold); font-weight:700; font-size:12px; margin-top:2px}
.shopcard.owned{opacity:.55; border-color:var(--mint)}
.shopcard.owned .sprice{color:var(--mint)}
.shopcard.poor{opacity:.6; filter:saturate(.7)}

.btn{font-family:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 22px; font-size:15px; font-weight:700;
  background:linear-gradient(180deg,#ffd66b,#e8a838); color:#3a2b00; box-shadow:0 3px 0 #b8891f; transition:filter .12s,transform .06s;}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #b8891f}
.btn.ghost{background:linear-gradient(180deg,#6a5cb0,#4a3d8c); color:var(--ink); box-shadow:0 3px 0 #2f2866}
.btn.small{padding:7px 14px; font-size:13px}

/* ================= 图鉴 ================= */
.codex-tabs{display:flex; gap:6px; justify-content:center; margin-bottom:14px; flex-wrap:wrap}
.codex-tabs .ctab{font-family:inherit; cursor:pointer; border:0; border-radius:8px; padding:6px 14px; font-size:13px;
  background:rgba(255,255,255,.06); color:var(--inkdim); border:1px solid var(--frame2)}
.codex-tabs .ctab.on{background:linear-gradient(180deg,#6a5cb0,#4a3d8c); color:var(--gold2); font-weight:700}
.codex-grid{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-height:480px; overflow-y:auto; padding:4px}
.cx-entry{width:150px; border-radius:12px; padding:10px 8px; background:rgba(255,255,255,.05);
  border:2px solid var(--frame); text-align:center}
.cx-entry .cxi{font-size:28px; line-height:1.2}
.cx-entry .cxn{font-weight:700; font-size:13px; margin-top:4px}
.cx-entry .cxd{font-size:10.5px; color:var(--inkdim); line-height:1.45; margin-top:4px}
.cx-entry .cxw{font-size:10px; margin-top:3px; color:var(--gold)}
.cx-entry.locked{opacity:.4; filter:grayscale(.8)}
.cx-entry.locked .cxn{color:var(--inkdim)}
.cx-legend{font-size:11px; color:var(--inkdim); text-align:left; margin:10px auto 0; max-width:640px; line-height:1.7}

/* ================= 设置 ================= */
.setrow{display:flex; align-items:center; justify-content:space-between; gap:14px; max-width:420px;
  margin:10px auto; padding:8px 14px; background:rgba(255,255,255,.05); border-radius:10px; border:1px solid var(--frame)}
.setrow .sl{font-size:14px; color:var(--ink)}
.setrow .sr{display:flex; gap:6px}
.seg{font-family:inherit; cursor:pointer; border:0; border-radius:7px; padding:5px 12px; font-size:12.5px;
  background:rgba(255,255,255,.08); color:var(--inkdim); border:1px solid var(--frame2)}
.seg.on{background:linear-gradient(180deg,#ffd66b,#e8a838); color:#3a2b00; font-weight:700}

/* ================= 教程 ================= */
#ov-help .panel{max-width:640px}
.tut-step{text-align:left; margin:8px 0; padding:10px 14px; background:rgba(255,255,255,.05);
  border-left:4px solid var(--gold); border-radius:8px; font-size:13.5px; line-height:1.7}
.tut-step b{color:var(--gold2)}

#toast{position:absolute; top:40px; left:50%; transform:translateX(-50%); z-index:40;
  background:var(--panel); border:2px solid var(--frame2); border-radius:20px; padding:8px 18px;
  font-size:14px; color:var(--gold); box-shadow:0 6px 24px rgba(0,0,0,.5);
  opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; white-space:nowrap;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(2px)}
#toast.warn{color:var(--hp); border-color:var(--hp)}

.kbd-hint{font-size:11px; color:var(--inkdim); white-space:nowrap}
.kbd-hint span{border:1px solid var(--frame2); border-radius:4px; padding:0 4px; margin:0 2px; background:rgba(255,255,255,.05)}
.debug-box{position:absolute; right:8px; top:8px; z-index:50; text-align:right}
.debug-box select,.debug-box input{font-size:11px; background:#14102f; color:var(--ink); border:1px solid var(--frame2); border-radius:6px; padding:2px 4px; margin:2px 0}
</style>
</head>
<body>
<div id="wrap">
  <!-- 顶部信息条：章节/波次/事件/进度/下一波预览 -->
  <div id="topbar"></div>
  <canvas id="game" width="960" height="576"></canvas>

  <!-- 底部 HUD（由 JS 构建） -->
  <div id="hud"></div>

  <!-- 弹层 -->
  <div id="ov-menu" class="overlay show"><div class="panel" id="menu-panel"></div></div>
  <div id="ov-artifact" class="overlay"><div class="panel" id="artifact-panel"></div></div>
  <div id="ov-upgrade" class="overlay"><div class="panel" id="upgrade-panel"></div></div>
  <div id="ov-over" class="overlay"><div class="panel" id="over-panel"></div></div>
  <div id="ov-shop" class="overlay"><div class="panel" id="shop-panel"></div></div>
  <div id="ov-codex" class="overlay"><div class="panel" id="codex-panel"></div></div>
  <div id="ov-settings" class="overlay"><div class="panel" id="settings-panel"></div></div>
  <div id="ov-help" class="overlay"><div class="panel" id="help-panel"></div></div>
  <div id="toast"></div>
</div>

<script src="js/00-data.js"></script>
<script src="js/01-util.js"></script>
<script src="js/02-core.js"></script>
<script src="js/03-ui.js"></script>
<script src="js/04-main.js"></script>
</body>
</html>
